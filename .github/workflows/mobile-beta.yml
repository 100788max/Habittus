name: Mobile beta validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --strict-peer-dependencies=false

      - name: Run lint, types, audits and tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm audit:static
          pnpm test:behavior

      - name: Run Expo Doctor
        run: pnpm doctor

      - name: Export Android and web bundles
        run: |
          pnpm export:android
          pnpm export:web

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install

      - name: Build installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare and verify APK
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/HABITTUS-beta.apk
          test -s release/HABITTUS-beta.apk
          unzip -t release/HABITTUS-beta.apk >/dev/null

      - name: Upload validation files
        uses: actions/upload-artifact@v4
        with:
          name: habittus-mobile-validation
          if-no-files-found: error
          path: |
            pnpm-lock.yaml
            dist/android
            dist/web

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HABITTUS-beta-APK
          if-no-files-found: error
          retention-days: 30
          path: release/HABITTUS-beta.apk
